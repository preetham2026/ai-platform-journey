apiVersion: apps/v1
kind: Deployment
metadata:
  name: ritham-farm-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ritham-farm
  template:
    metadata:
      labels:
        app: ritham-farm
    spec:
      containers:
      - name: ritham-farm
        image: ritham-farm-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: ritham-farm-service
spec:
  selector:
    app: ritham-farm
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000
  type: LoadBalancer
